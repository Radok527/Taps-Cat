server {
    listen 80;

    # Docker internal DNS resolver — prevents "host not found" on startup
    resolver 127.0.0.11 valid=10s;

    # Allow embedding as iframe only from the portfolio origin
    add_header Content-Security-Policy "frame-ancestors https://dennisheyer.dev" always;

    # API — strip /api prefix before forwarding to FastAPI
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # WebSocket — must come before the catch-all /
    location /ws {
        proxy_pass http://api:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Generated images — served from the shared Docker volume
    location /images/ {
        alias /images/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend static files
    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
    }
}
